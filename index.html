<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-display);padding-bottom:env(safe-area-inset-bottom);}

  nav.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--border);}
  nav.tabs button{flex:1;min-height:44px;background:none;border:none;color:var(--muted);font-family:var(--font-display);font-size:14px;padding:10px 4px 12px;cursor:pointer;border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--text);border-bottom:2px solid var(--accent);}

  main{padding:18px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent);padding:16px;margin-bottom:14px;}

<script>
const DAY_NAMES = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DAY_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

let sessions = [];
let settings = null;

const defaultSettings = {
  consumo: 12,
  precoCombustivel: 7.00,
  metaBrutaSemana: 1768.62,
  metaLiquidaSemana: 1323.01,
  schedule: {1:7, 2:6.5, 3:7, 4:6.5, 5:8, 6:6, 0:6}, // 0=Dom..6=Sab
  fimProjecao: '2026-09-30'
};

function seedSessions(){
  return [
    {id: genId(), date:'2026-08-28', hours:4, odometerMode:false, kmStart:null, kmEnd:null, kmRodado:61, earnings:168, trips:13, fuelLiters:null, fuelValue:null, otherExpenses:0, note:'2 blocos: 15h-17h e 19h-21h'},
    {id: genId(), date:'2026-08-29', hours:4, odometerMode:false, kmStart:null, kmEnd:null, kmRodado:69, earnings:133, trips:10, fuelLiters: +(100/7).toFixed(2), fuelValue:100, otherExpenses:0, note:'Abastecimento de R$100 (tanque cheio, não é o custo do dia)'},
    {id: genId(), date:'2026-08-30', hours:4.83, odometerMode:false, kmStart:null, kmEnd:null, kmRodado:77.36, earnings:215, trips:18, fuelLiters:null, fuelValue:null, otherExpenses:0, note:''}
  ];
}

function genId(){ return 'id'+Date.now()+Math.random().toString(16).slice(2); }

// Converte "04:50" -> 4.833... horas decimais. Aceita também decimal puro (ex: "4.5") por compatibilidade.
function parseDuration(str){
  if (!str) return 0;
  str = str.trim();
  if (str.indexOf(':') !== -1){
    const [h, m] = str.split(':').map(n=>parseInt(n,10)||0);
    return h + (m/60);
  }
  return parseFloat(str.replace(',','.'))||0;
}
// Converte horas decimais -> "04:50"
function formatDuration(decimalHours){
  const total = Math.round((decimalHours||0)*60);
  let h = Math.floor(total/60);
  let m = total%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

// ---------- SUPABASE CLIENT & AUTH ----------
const supa = (typeof window !== 'undefined' && window.supabase && SUPABASE_URL.indexOf('COLE_AQUI') === -1)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let currentUser = null;

function configMissing(){
  return !supa;
}

// ---------- mapping between JS camelCase and Postgres snake_case ----------
function dbRowToSession(row){
  return {
    id: row.id,
    date: row.date,
    hours: Number(row.hours)||0,
    odometerMode: !!row.odometer_mode,
    kmStart: row.km_start===null?null:Number(row.km_start),
    kmEnd: row.km_end===null?null:Number(row.km_end),
    kmRodado: row.km_rodado===null?null:Number(row.km_rodado),
    earnings: Number(row.earnings)||0,
    trips: Number(row.trips)||0,
    fuelLiters: row.fuel_liters===null?null:Number(row.fuel_liters),
    fuelValue: row.fuel_value===null?null:Number(row.fuel_value),
    otherExpenses: Number(row.other_expenses)||0,
    note: row.note||''
  };
}
function sessionToDbRow(s){
  return {
    user_id: currentUser.id,
    date: s.date,
    hours: s.hours,
    odometer_mode: s.odometerMode,
    km_start: s.kmStart,
    km_end: s.kmEnd,
    km_rodado: s.kmRodado,
    earnings: s.earnings,
    trips: s.trips,
    fuel_liters: s.fuelLiters,
    fuel_value: s.fuelValue,
    other_expenses: s.otherExpenses,
    note: s.note
  };
}
function dbRowToSettings(row){
  return {
    consumo: Number(row.consumo),
    precoCombustivel: Number(row.preco_combustivel),
    metaBrutaSemana: Number(row.meta_bruta_semana),
    metaLiquidaSemana: Number(row.meta_liquida_semana),
    schedule: typeof row.schedule === 'string' ? JSON.parse(row.schedule) : row.schedule,
    fimProjecao: row.fim_projecao
  };
}
function settingsToDbRow(s){
  return {
    user_id: currentUser.id,
    consumo: s.consumo,
    preco_combustivel: s.precoCombustivel,
    meta_bruta_semana: s.metaBrutaSemana,
    meta_liquida_semana: s.metaLiquidaSemana,
    schedule: s.schedule,
    fim_projecao: s.fimProjecao
  };
}

async function loadAll(){
  const {data: sessData, error: sessErr} = await supa
    .from('sessions').select('*').eq('user_id', currentUser.id).order('date', {ascending:false});
  if (sessErr){ console.error('fetch sessions failed', sessErr); sessions = []; }
  else if (sessData.length === 0){
    // primeira vez neste usuário: semeia com os 3 dias já rodados
    const seeded = seedSessions();
    for (const s of seeded){
      await supa.from('sessions').insert(sessionToDbRow(s));
    }
    const {data: reloaded} = await supa.from('sessions').select('*').eq('user_id', currentUser.id).order('date', {ascending:false});
    sessions = (reloaded||[]).map(dbRowToSession);
  } else {
    sessions = sessData.map(dbRowToSession);
  }

  const {data: setData, error: setErr} = await supa
    .from('settings').select('*').eq('user_id', currentUser.id).maybeSingle();
  if (setErr || !setData){
    settings = {...defaultSettings};
    await supa.from('settings').insert(settingsToDbRow(settings));
  } else {
    settings = dbRowToSettings(setData);
  }
}

async function addSession(session){
  try{
    const {data, error} = await supa.from('sessions').insert(sessionToDbRow(session)).select().single();
    if (error) throw error;
    sessions.push(dbRowToSession(data));
    return true;
  }catch(e){
    console.error('insert session failed', e);
    return false;
  }
}

async function deleteSessionById(id){
  try{
    const {error} = await supa.from('sessions').delete().eq('id', id).eq('user_id', currentUser.id);
    if (error) throw error;
    sessions = sessions.filter(s=>s.id!==id);
    return true;
  }catch(e){
    console.error('delete session failed', e);
    return false;
  }
}

async function persistSettings(){
  try{
    const {error} = await supa.from('settings').upsert(settingsToDbRow(settings), {onConflict:'user_id'});
    if (error) throw error;
    return true;
  }catch(e){
    console.error('save settings failed', e);
    return false;
  }
}

// usado só na restauração de backup: substitui tudo no banco pelo backup colado
async function replaceAllFromBackup(newSessions, newSettings){
  try{
    await supa.from('sessions').delete().eq('user_id', currentUser.id);
    for (const s of newSessions){
      await supa.from('sessions').insert(sessionToDbRow(s));
    }
    await supa.from('settings').upsert(settingsToDbRow(newSettings), {onConflict:'user_id'});
    return true;
  }catch(e){
    console.error('restore backup failed', e);
    return false;
  }
}

function fmtBRL(n){
  if (n === null || n === undefined || isNaN(n)) return 'R$ 0,00';
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtKm(n){ return n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2}) + ' km'; }
function fmtDatePt(iso){
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function custoPorKm(){ return settings.precoCombustivel / settings.consumo; }

function computeSession(s){
  const kmRodado = s.odometerMode ? Math.max(0, (s.kmEnd||0) - (s.kmStart||0)) : (s.kmRodado||0);
  const custoComb = kmRodado * custoPorKm();
  const outras = s.otherExpenses || 0;
  const lucroLiquido = (s.earnings||0) - custoComb - outras;
  const ganhoKm = kmRodado > 0 ? (s.earnings||0)/kmRodado : 0;
  const ganhoHora = s.hours > 0 ? (s.earnings||0)/s.hours : 0;
  return {kmRodado, custoComb, lucroLiquido, ganhoKm, ganhoHora};
}

function weekBounds(dateObj){
  const d = new Date(dateObj);
  const day = d.getDay(); // 0=Sun
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  return {monday, sunday};
}
function isoDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function sessionsInRange(startIso, endIso){
  return sessions.filter(s => s.date >= startIso && s.date <= endIso);
}

function totalHoursScheduleWeek(){
  return Object.values(settings.schedule).reduce((a,b)=>a+b,0);
}

function averages(){
  if (sessions.length === 0) return {ganhoKm:0, ganhoHora:0, kmPorHora:0, ganhoCorrida:0};
  let sumEarnings=0,sumKm=0,sumHours=0,sumTrips=0;
  sessions.forEach(s=>{
    const c = computeSession(s);
    sumEarnings += s.earnings||0;
    sumKm += c.kmRodado;
    sumHours += s.hours||0;
    sumTrips += s.trips||0;
  });
  return {
    ganhoKm: sumKm>0 ? sumEarnings/sumKm : 0,
    ganhoHora: sumHours>0 ? sumEarnings/sumHours : 0,
    kmPorHora: sumHours>0 ? sumKm/sumHours : 0,
    ganhoCorrida: sumTrips>0 ? sumEarnings/sumTrips : 0
  };
}

function projecaoAteFim(){
  const avg = averages();
  const today = new Date(); today.setHours(0,0,0,0);
  const fim = new Date(settings.fimProjecao+'T00:00:00');
  let horasRestantes = 0;
  const cursor = new Date(today); cursor.setDate(cursor.getDate()+1); // a partir de amanhã
  while (cursor <= fim){
    horasRestantes += settings.schedule[cursor.getDay()] || 0;
    cursor.setDate(cursor.getDate()+1);
  }
  const kmEstimado = horasRestantes * avg.kmPorHora;
  const brutoEstimado = horasRestantes * avg.ganhoHora;
  const custoEstimado = kmEstimado * custoPorKm();
  const liquidoEstimado = brutoEstimado - custoEstimado;
  return {horasRestantes, kmEstimado, brutoEstimado, custoEstimado, liquidoEstimado};
}

// ---------- RENDER: HOJE ----------
function renderHoje(){
  const todayIso = isoDate(new Date());
  const todaySessions = sessions.filter(s=>s.date===todayIso);
  const {monday, sunday} = weekBounds(new Date());
  const weekSessions = sessionsInRange(isoDate(monday), isoDate(sunday));

  let sumEarnings=0,sumKm=0,sumLucro=0,sumHours=0;
  todaySessions.forEach(s=>{ const c=computeSession(s); sumEarnings+=s.earnings||0; sumKm+=c.kmRodado; sumLucro+=c.lucroLiquido; sumHours+=s.hours||0; });
  const ganhoKm = sumKm>0 ? sumEarnings/sumKm : 0;
  const ganhoHora = sumHours>0 ? sumEarnings/sumHours : 0;

  let weekEarnings=0;
  weekSessions.forEach(s=>{ weekEarnings += s.earnings||0; });
  const metaSemana = settings.metaBrutaSemana;
  const pct = metaSemana>0 ? Math.min(100, (weekEarnings/metaSemana)*100) : 0;

  const html = `
    <div class="panel">
      <h2>Faturamento hoje</h2>
      <div class="odo-readout">
        <div>
          <span class="lbl">Ganho bruto</span>
          <span class="big">${fmtBRL(sumEarnings).replace('R$','').trim()}</span>
        </div>
        <div>
          <span class="lbl">Km rodado</span>
          <span class="big" style="font-size:22px;color:var(--text)">${sumKm.toFixed(1)}<span class="unit">km</span></span>
        </div>
      </div>
      <div class="metric-grid">
        <div class="metric"><div class="lbl">Lucro líquido</div><div class="val ${sumLucro>=0?'good':'bad'}">${fmtBRL(sumLucro)}</div></div>
        <div class="metric"><div class="lbl">Ganho / hora</div><div class="val">${fmtBRL(ganhoHora)}</div></div>
        <div class="metric"><div class="lbl">Ganho / km</div><div class="val">${fmtBRL(ganhoKm)}</div></div>
        <div class="metric"><div class="lbl">Sessões hoje</div><div class="val">${todaySessions.length}</div></div>
      </div>
      ${todaySessions.length===0 ? '<div class="empty">Nenhuma sessão lançada hoje ainda.</div>' : ''}
    </div>

    <div class="panel">
      <h2>Progresso da semana (${fmtDatePt(isoDate(monday))} – ${fmtDatePt(isoDate(sunday))})</h2>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><span>${fmtBRL(weekEarnings)}</span><span>meta ${fmtBRL(metaSemana)}</span></div>
      </div>
    </div>

    <div class="panel">
      <h2>Lançar sessão</h2>
      <form id="session-form">
        <div class="field">
          <label>Data</label>
          <input type="date" name="date" value="${todayIso}" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Horas trabalhadas (hh:mm)</label>
            <input type="text" inputmode="numeric" name="hours" placeholder="ex: 04:50" pattern="[0-9]{1,2}:[0-5][0-9]" title="formato hh:mm, ex: 04:50" required>
          </div>
          <div class="field">
            <label>Corridas</label>
            <input type="number" step="1" name="trips" placeholder="ex: 12" required>
          </div>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="odo-toggle" name="odometerMode">
          <label for="odo-toggle" style="margin:0;">Tenho leitura do odômetro (km inicial/final)</label>
        </div>
        <div id="odo-fields" style="display:none;">
          <div class="field-row">
            <div class="field"><label>Km inicial</label><input type="number" step="0.1" name="kmStart" placeholder="odômetro início"></div>
            <div class="field"><label>Km final</label><input type="number" step="0.1" name="kmEnd" placeholder="odômetro fim"></div>
          </div>
        </div>
        <div id="km-direct-field" class="field">
          <label>Km rodado</label>
          <input type="number" step="0.1" name="kmRodado" placeholder="ex: 65">
        </div>
        <div class="field">
          <label>Ganho bruto (R$)</label>
          <input type="number" step="0.01" name="earnings" placeholder="ex: 180.00" required>
        </div>
        <div class="field-row">
          <div class="field"><label>Combustível abastecido — litros (opcional)</label><input type="number" step="0.01" name="fuelLiters" placeholder="opcional"></div>
          <div class="field"><label>Valor pago no combustível (opcional)</label><input type="number" step="0.01" name="fuelValue" placeholder="opcional"></div>
        </div>
        <div class="field">
          <label>Outras despesas do dia (opcional)</label>
          <input type="number" step="0.01" name="otherExpenses" placeholder="lavagem, alimentação...">
        </div>
        <div class="field">
          <label>Observação (opcional)</label>
          <textarea name="note" rows="2" placeholder="ex: choveu à tarde, trânsito parado..."></textarea>
        </div>
        <button type="submit" class="primary">Salvar sessão</button>
        <div class="save-msg" id="save-msg"></div>
      </form>
    </div>
  `;
  document.getElementById('tab-hoje').innerHTML = html;

  const odoToggle = document.getElementById('odo-toggle');
  const odoFields = document.getElementById('odo-fields');
  const kmDirect = document.getElementById('km-direct-field');
  odoToggle.addEventListener('change', ()=>{
    odoFields.style.display = odoToggle.checked ? 'block' : 'none';
    kmDirect.style.display = odoToggle.checked ? 'none' : 'block';
  });

  document.getElementById('session-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const odometerMode = fd.get('odometerMode') === 'on';
    const session = {
      id: genId(),
      date: fd.get('date'),
      hours: parseDuration(fd.get('hours')),
      odometerMode,
      kmStart: odometerMode ? (parseFloat(fd.get('kmStart'))||0) : null,
      kmEnd: odometerMode ? (parseFloat(fd.get('kmEnd'))||0) : null,
      kmRodado: odometerMode ? null : (parseFloat(fd.get('kmRodado'))||0),
      earnings: parseFloat(fd.get('earnings'))||0,
      trips: parseInt(fd.get('trips'))||0,
      fuelLiters: fd.get('fuelLiters') ? parseFloat(fd.get('fuelLiters')) : null,
      fuelValue: fd.get('fuelValue') ? parseFloat(fd.get('fuelValue')) : null,
      otherExpenses: fd.get('otherExpenses') ? parseFloat(fd.get('otherExpenses')) : 0,
      note: fd.get('note') || ''
    };
    const ok = await addSession(session);
    const msgEl = document.getElementById('save-msg');
    if (ok){
      msgEl.textContent = 'Sessão salva.';
      msgEl.style.color = 'var(--good)';
    } else {
      msgEl.textContent = 'Não consegui salvar no banco agora — tente de novo em instantes.';
      msgEl.style.color = 'var(--bad)';
    }
    renderAll();
  });
}

// ---------- RENDER: SESSÕES ----------
function renderSessoes(){
  const sorted = [...sessions].sort((a,b)=> b.date.localeCompare(a.date));
  let html = '<div class="panel"><h2>Histórico de sessões</h2>';
  if (sorted.length===0){
    html += '<div class="empty">Nenhuma sessão lançada ainda.</div>';
  } else {
    sorted.forEach(s=>{
      const c = computeSession(s);
      html += `
        <div class="session-card ${c.lucroLiquido>=0?'positive':''}">
          <div class="row1">
            <span class="date">${fmtDatePt(s.date)}</span>
            <span class="earnings">${fmtBRL(s.earnings)}</span>
          </div>
          <div class="row2">
            <span>${formatDuration(s.hours)}</span>
            <span>${s.trips} corridas</span>
            <span>${c.kmRodado.toFixed(1)} km</span>
            <span>${fmtBRL(c.ganhoKm)}/km</span>
            <span>${fmtBRL(c.ganhoHora)}/h</span>
            <span class="${c.lucroLiquido>=0?'good':'bad'}" style="color:${c.lucroLiquido>=0?'var(--good)':'var(--bad)'}">líq. ${fmtBRL(c.lucroLiquido)}</span>
          </div>
          ${s.fuelValue ? `<div class="note">Abasteceu ${fmtBRL(s.fuelValue)}${s.fuelLiters?` (${s.fuelLiters}L)`:''}</div>` : ''}
          ${s.note ? `<div class="note">${s.note}</div>` : ''}
          <div class="actions"><button class="ghost" data-del="${s.id}">Excluir</button></div>
        </div>
      `;
    });
  }
  html += '</div>';
  document.getElementById('tab-sessoes').innerHTML = html;
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const card = btn.closest('.session-card');
      const dateLabel = card ? card.querySelector('.date').textContent : 'essa sessão';
      if (!confirm('Excluir a sessão de ' + dateLabel + '? Essa ação não pode ser desfeita.')) return;
      await deleteSessionById(btn.getAttribute('data-del'));
      renderAll();
    });
  });
}

// ---------- RENDER: METAS ----------
function renderMetas(){
  const {monday, sunday} = weekBounds(new Date());
  const totalHoras = totalHoursScheduleWeek();
  const todayDow = new Date().getDay();

  let rows = '';
  for (let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const dow = d.getDay();
    const horas = settings.schedule[dow] || 0;
    const metaDia = totalHoras>0 ? (horas/totalHoras)*settings.metaBrutaSemana : 0;
    const dIso = isoDate(d);
    const ganhoDia = sessions.filter(s=>s.date===dIso).reduce((a,s)=>a+(s.earnings||0),0);
    const pctDia = metaDia>0 ? Math.min(999,(ganhoDia/metaDia)*100) : 0;
    rows += `
      <tr class="${dow===todayDow?'today':''}">
        <td class="day-name">${DAY_SHORT[dow]} ${fmtDatePt(dIso).slice(0,5)}</td>
        <td>${horas}h</td>
        <td>${fmtBRL(metaDia)}</td>
        <td>${fmtBRL(ganhoDia)}</td>
        <td style="color:${pctDia>=100?'var(--good)':'var(--muted)'}">${pctDia.toFixed(0)}%</td>
      </tr>
    `;
  }

  const proj = projecaoAteFim();
  const avg = averages();

  let combustivelRows = '';
  let totalLitrosSemana = 0;
  let totalCustoSemana = 0;
  for (let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const dow = d.getDay();
    const horas = settings.schedule[dow] || 0;
    const kmEstimadoDia = horas * avg.kmPorHora;
    const litrosDia = settings.consumo>0 ? kmEstimadoDia / settings.consumo : 0;
    const custoDia = kmEstimadoDia * custoPorKm();
    totalLitrosSemana += litrosDia;
    totalCustoSemana += custoDia;
    combustivelRows += `
      <tr class="${dow===todayDow?'today':''}">
        <td class="day-name">${DAY_SHORT[dow]}</td>
        <td>${horas}h</td>
        <td>${kmEstimadoDia.toFixed(0)} km</td>
        <td>${litrosDia.toFixed(1)} l</td>
        <td>${fmtBRL(custoDia)}</td>
      </tr>
    `;
  }

  const html = `
    <div class="panel">
      <h2>Meta da semana por dia</h2>
      <table class="goal-table">
        <thead><tr><th>Dia</th><th>Horas</th><th>Meta bruta</th><th>Realizado</th><th>%</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="note-box">Meta diária calculada proporcionalmente às horas de cada dia da sua grade, sobre a meta bruta semanal definida em Ajustes.</div>
    </div>

    <div class="panel">
      <h2>Médias atuais (todas as sessões)</h2>
      <div class="metric-grid">
        <div class="metric"><div class="lbl">Ganho / km</div><div class="val">${fmtBRL(avg.ganhoKm)}</div></div>
        <div class="metric"><div class="lbl">Ganho / hora</div><div class="val">${fmtBRL(avg.ganhoHora)}</div></div>
        <div class="metric"><div class="lbl">Km / hora</div><div class="val">${avg.kmPorHora.toFixed(2)}</div></div>
        <div class="metric"><div class="lbl">Ganho / corrida</div><div class="val">${fmtBRL(avg.ganhoCorrida)}</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>Combustível para a semana</h2>
      <table class="goal-table">
        <thead><tr><th>Dia</th><th>Horas</th><th>Km estimado</th><th>Litros</th><th>Valor a reservar (R$)</th></tr></thead>
        <tbody>${combustivelRows}</tbody>
      </table>
      <div class="metric-grid">
        <div class="metric"><div class="lbl">Litros na semana</div><div class="val">${totalLitrosSemana.toFixed(1)} l</div></div>
        <div class="metric"><div class="lbl">Gasto estimado na semana</div><div class="val">${fmtBRL(totalCustoSemana)}</div></div>
      </div>
      <div class="note-box">Não precisa abastecer todo dia com esse valor exato — dá pra fazer abastecimentos maiores a cada 3-4 dias, somando os valores dos dias. O ideal é comparar os litros realmente abastecidos com o km rodado no período pra calibrar se o consumo real do carro está batendo com os ${settings.consumo} km/l cadastrados.</div>
    </div>

    <div class="panel">
      <h2>Projeção até ${fmtDatePt(settings.fimProjecao)}</h2>
      <div class="metric-grid">
        <div class="metric"><div class="lbl">Horas restantes na grade</div><div class="val">${proj.horasRestantes.toFixed(1)}h</div></div>
        <div class="metric"><div class="lbl">Km estimado</div><div class="val">${proj.kmEstimado.toFixed(0)} km</div></div>
        <div class="metric"><div class="lbl">Bruto estimado</div><div class="val">${fmtBRL(proj.brutoEstimado)}</div></div>
        <div class="metric"><div class="lbl">Líquido estimado</div><div class="val good">${fmtBRL(proj.liquidoEstimado)}</div></div>
      </div>
      <div class="note-box">Projeção recalculada automaticamente com base na média de todas as sessões lançadas. Quanto mais dias você registrar, mais confiável ela fica.</div>
    </div>
  `;
  document.getElementById('tab-metas').innerHTML = html;
}

// ---------- RENDER: AJUSTES ----------
function renderAjustes(){
  const sc = settings.schedule;
  const html = `
    <div class="panel">
      <h2>Carro e combustível</h2>
      <form id="settings-form">
        <div class="settings-grid">
          <div class="field"><label>Consumo médio (km/l)</label><input type="number" step="0.1" name="consumo" value="${settings.consumo}"></div>
          <div class="field"><label>Preço do combustível (R$/l)</label><input type="number" step="0.01" name="precoCombustivel" value="${settings.precoCombustivel}"></div>
        </div>
        <h2 style="margin-top:16px;">Metas</h2>
        <div class="settings-grid">
          <div class="field"><label>Meta bruta semanal (R$)</label><input type="number" step="0.01" name="metaBrutaSemana" value="${settings.metaBrutaSemana}"></div>
          <div class="field"><label>Meta líquida semanal (R$)</label><input type="number" step="0.01" name="metaLiquidaSemana" value="${settings.metaLiquidaSemana}"></div>
        </div>
        <div class="field"><label>Projetar receita até (data)</label><input type="date" name="fimProjecao" value="${settings.fimProjecao}"></div>

        <h2 style="margin-top:16px;">Grade de horários (horas por dia)</h2>
        <div class="settings-grid">
          <div class="field"><label>Segunda</label><input type="number" step="0.1" name="sch1" value="${sc[1]}"></div>
          <div class="field"><label>Terça</label><input type="number" step="0.1" name="sch2" value="${sc[2]}"></div>
          <div class="field"><label>Quarta</label><input type="number" step="0.1" name="sch3" value="${sc[3]}"></div>
          <div class="field"><label>Quinta</label><input type="number" step="0.1" name="sch4" value="${sc[4]}"></div>
          <div class="field"><label>Sexta</label><input type="number" step="0.1" name="sch5" value="${sc[5]}"></div>
          <div class="field"><label>Sábado</label><input type="number" step="0.1" name="sch6" value="${sc[6]}"></div>
          <div class="field"><label>Domingo</label><input type="number" step="0.1" name="sch0" value="${sc[0]}"></div>
        </div>
        <button type="submit" class="primary">Salvar ajustes</button>
        <div class="save-msg" id="settings-save-msg"></div>
      </form>
    </div>
    <div class="panel">
      <h2>Sobre os dados</h2>
      <div class="note-box">Tudo o que você lança tenta salvar automaticamente na sua conta. Se o salvamento automático estiver falhando (erro de servidor), use o backup manual abaixo pra não perder nada.</div>
    </div>
    <div class="panel">
      <h2>Backup manual</h2>
      <div class="note-box">Copie o texto abaixo e guarde num app de notas. Se o salvamento automático falhar, cole esse texto de volta no campo "Restaurar backup" mais tarde (ou numa sessão nova) pra recuperar tudo.</div>
      <div class="field" style="margin-top:10px;">
        <label>Seus dados atuais (copie e guarde)</label>
        <textarea id="backup-out" rows="5" readonly style="font-size:11px;"></textarea>
      </div>
      <button type="button" class="ghost" id="copy-backup" style="margin-bottom:16px;">Copiar backup</button>
      <div class="field">
        <label>Restaurar backup (cole o texto salvo aqui)</label>
        <textarea id="backup-in" rows="5" style="font-size:11px;" placeholder="cole aqui o texto que você copiou antes"></textarea>
      </div>
      <button type="button" class="ghost" id="restore-backup">Restaurar backup</button>
      <div class="save-msg" id="backup-msg"></div>
    </div>
  `;
  document.getElementById('tab-ajustes').innerHTML = html;
  document.getElementById('backup-out').value = JSON.stringify({settings, sessions});
  document.getElementById('copy-backup').addEventListener('click', async ()=>{
    const ta = document.getElementById('backup-out');
    ta.select();
    try{
      await navigator.clipboard.writeText(ta.value);
      document.getElementById('backup-msg').textContent = 'Copiado.';
      document.getElementById('backup-msg').style.color = 'var(--good)';
    }catch(e){
      document.getElementById('backup-msg').textContent = 'Não copiou automático — selecione o texto acima e copie manualmente.';
      document.getElementById('backup-msg').style.color = 'var(--bad)';
    }
  });
  document.getElementById('restore-backup').addEventListener('click', async ()=>{
    const msgEl = document.getElementById('backup-msg');
    try{
      const parsed = JSON.parse(document.getElementById('backup-in').value);
      if (!parsed.sessions || !parsed.settings) throw new Error('formato inválido');
      const ok = await replaceAllFromBackup(parsed.sessions, parsed.settings);
      if (ok){
        await loadAll();
        msgEl.textContent = 'Backup restaurado e salvo.';
        msgEl.style.color = 'var(--good)';
      } else {
        msgEl.textContent = 'Não consegui salvar no banco — tente de novo.';
        msgEl.style.color = 'var(--bad)';
      }
      renderAll();
    }catch(e){
      msgEl.textContent = 'Texto inválido — cole exatamente o que foi copiado antes.';
      msgEl.style.color = 'var(--bad)';
    }
  });

  document.getElementById('settings-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    settings.consumo = parseFloat(fd.get('consumo'))||settings.consumo;
    settings.precoCombustivel = parseFloat(fd.get('precoCombustivel'))||settings.precoCombustivel;
    settings.metaBrutaSemana = parseFloat(fd.get('metaBrutaSemana'))||settings.metaBrutaSemana;
    settings.metaLiquidaSemana = parseFloat(fd.get('metaLiquidaSemana'))||settings.metaLiquidaSemana;
    settings.fimProjecao = fd.get('fimProjecao')||settings.fimProjecao;
    settings.schedule = {
      0: parseFloat(fd.get('sch0'))||0, 1: parseFloat(fd.get('sch1'))||0, 2: parseFloat(fd.get('sch2'))||0,
      3: parseFloat(fd.get('sch3'))||0, 4: parseFloat(fd.get('sch4'))||0, 5: parseFloat(fd.get('sch5'))||0,
      6: parseFloat(fd.get('sch6'))||0
    };
    const ok = await persistSettings();
    const msgEl = document.getElementById('settings-save-msg');
    if (ok){
      msgEl.textContent = 'Ajustes salvos.';
      msgEl.style.color = 'var(--good)';
    } else {
      msgEl.textContent = 'Não consegui salvar no servidor agora — tente de novo em instantes.';
      msgEl.style.color = 'var(--bad)';
    }
    renderAll();
  });
}

function renderAll(){
  renderHoje();
  renderSessoes();
  renderMetas();
  renderAjustes();
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.getAttribute('data-tab')).classList.add('active');
  });
});

// ---------- AUTH GATE ----------
let authMode = 'signin'; // ou 'signup'

function showGate(){
  document.getElementById('auth-gate').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}
async function showApp(){
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('account-email').textContent = currentUser.email;
  await loadAll();
  renderAll();
}

document.getElementById('auth-toggle-link').addEventListener('click', ()=>{
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('auth-submit').textContent = authMode === 'signin' ? 'Entrar' : 'Criar conta';
  document.getElementById('auth-toggle-text').textContent = authMode === 'signin' ? 'Ainda não tem conta?' : 'Já tem conta?';
  document.getElementById('auth-toggle-link').textContent = authMode === 'signin' ? 'Criar conta' : 'Entrar';
  document.getElementById('auth-msg').textContent = '';
});

document.getElementById('auth-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msgEl = document.getElementById('auth-msg');
  msgEl.style.color = 'var(--muted)';
  msgEl.textContent = 'Um instante...';
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;

  if (configMissing()){
    msgEl.style.color = 'var(--bad)';
    msgEl.textContent = 'O app ainda não está configurado: falta colar SUPABASE_URL e SUPABASE_ANON_KEY no código.';
    return;
  }

  if (authMode === 'signin'){
    const {data, error} = await supa.auth.signInWithPassword({email, password});
    if (error){
      msgEl.style.color = 'var(--bad)';
      msgEl.textContent = 'Não entrou: ' + error.message;
      return;
    }
    currentUser = data.user;
    await showApp();
  } else {
    const {data, error} = await supa.auth.signUp({email, password});
    if (error){
      msgEl.style.color = 'var(--bad)';
      msgEl.textContent = 'Não criou a conta: ' + error.message;
      return;
    }
    if (data.session){
      currentUser = data.user;
      await showApp();
    } else {
      msgEl.style.color = 'var(--good)';
      msgEl.textContent = 'Conta criada. Se pedir confirmação por e-mail, confirme e depois faça login.';
    }
  }
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  if (supa) await supa.auth.signOut();
  currentUser = null;
  showGate();
});

(async ()=>{
  if (configMissing()){
    showGate();
    document.getElementById('auth-msg').style.color = 'var(--bad)';
    document.getElementById('auth-msg').textContent = 'Configuração pendente: cole SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo.';
    return;
  }
  const {data} = await supa.auth.getSession();
  if (data.session){
    currentUser = data.session.user;
    await showApp();
  } else {
    showGate();
  }
})();
</script>
